name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
        env:
          POSTGRES_DB: sodnapraksa
          POSTGRES_PASSWORD: synthetic-password
          POSTGRES_USER: sodnapraksa_ingest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sodnapraksa_ingest -d sodnapraksa"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.5.9"
      - run: uv lock --check
      - run: uv run --locked --extra dev ruff format --check .
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev pytest
      - run: uv build
      - name: Verify systemd templates
        run: systemd-analyze verify deploy/systemd/*.service deploy/systemd/*.timer
      - name: Verify local Compose definition
        env:
          SODNAPRAKSA_DEV_POSTGRES_PASSWORD: synthetic-password
        run: docker compose --file deploy/compose.yaml config --quiet
      - name: Bootstrap empty PostgreSQL and Qdrant
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" \
            psql --username=sodnapraksa_ingest --dbname=sodnapraksa \
              --set=ON_ERROR_STOP=1 --set=ingest_role=sodnapraksa_ingest \
            < deploy/postgres/bootstrap.sql

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6333/readyz; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail-with-body --silent --show-error \
            --request PUT http://127.0.0.1:6333/collections/sodnapraksa_current \
            --header 'content-type: application/json' \
            --data-binary '{"vectors":{"size":3072,"distance":"Cosine"}}'

          for payload_field in evidencna_stevilka chunk_id chunk_hash; do
            curl --fail-with-body --silent --show-error \
              --request PUT 'http://127.0.0.1:6333/collections/sodnapraksa_current/index?wait=true' \
              --header 'content-type: application/json' \
              --data-binary "{\"field_name\":\"$payload_field\",\"field_schema\":\"keyword\"}"
          done

          curl --fail-with-body --silent --show-error \
            --request PUT 'http://127.0.0.1:6333/collections/sodnapraksa_current/index?wait=true' \
            --header 'content-type: application/json' \
            --data-binary '{"field_name":"chunk_index","field_schema":"integer"}'
      - name: Verify empty-target preflight and PostgreSQL write contract
        env:
          SODNAPRAKSA_ALLOW_EXTERNAL_API: "0"
          SODNAPRAKSA_ALLOW_WRITES: "0"
          SODNAPRAKSA_CHECKPOINT_PATH: /tmp/sodnapraksa-ingest/checkpoint.json
          SODNAPRAKSA_DATABASE_URL: postgresql://sodnapraksa_ingest:synthetic-password@127.0.0.1:5432/sodnapraksa
          SODNAPRAKSA_DISCOVERY_LIMIT: "5000"
          SODNAPRAKSA_DOCUMENT_LIMIT: "350"
          SODNAPRAKSA_EMBEDDING_API_KEY: synthetic-key
          SODNAPRAKSA_EMBEDDING_BASE_URL: https://embedding.example.invalid/v1
          SODNAPRAKSA_EMBEDDING_DIMENSIONS: "3072"
          SODNAPRAKSA_EMBEDDING_MODEL: text-embedding-3-large
          SODNAPRAKSA_EXPECTED_DATABASE: sodnapraksa
          SODNAPRAKSA_EXPECTED_SCHEMA: public
          SODNAPRAKSA_INITIAL_SINCE: "2026-08-01T00:00:00Z"
          SODNAPRAKSA_LOCK_PATH: /tmp/sodnapraksa-ingest/ingest.lock
          SODNAPRAKSA_MAX_EMBEDDING_INPUT_BYTES_PER_RUN: "2000000"
          SODNAPRAKSA_OVERLAP_DAYS: "7"
          SODNAPRAKSA_QDRANT_API_KEY: ""
          SODNAPRAKSA_QDRANT_COLLECTION: sodnapraksa_current
          SODNAPRAKSA_QDRANT_URL: http://127.0.0.1:6333
          SODNAPRAKSA_SOURCE_API_KEY: synthetic-key
          SODNAPRAKSA_SOURCE_BASE_URL: https://source.example.invalid/api2
        run: |
          mkdir -p /tmp/sodnapraksa-ingest
          uv run --locked sodnapraksa-ingest preflight | jq --exit-status \
            '.status == "ok" and .result.postgres.schema == "public" and
             .result.qdrant.collection == "sodnapraksa_current"'

          SODNAPRAKSA_ALLOW_EXTERNAL_API=1 SODNAPRAKSA_ALLOW_WRITES=1 \
            uv run --locked python - <<'PY'
          from sodnapraksa_ingest.config import load_settings
          from sodnapraksa_ingest.document import Document
          from sodnapraksa_ingest.pipeline import pg_save_document

          normalized = {
              "title": "Synthetic decision",
              "url": "https://source.example.invalid/synthetic",
              "feed_url": "",
              "sodisce": "Synthetic court",
              "oddelek": "",
              "ecli": "",
              "datum_odlocbe": "2026-08-01T00:00:00Z",
              "datum_nastanka": "2026-08-01T00:00:00Z",
              "datum_zadnje_spremembe": "2026-08-01T00:00:00Z",
              "metadata_hash": "b" * 64,
          }
          document = Document(
              "SYNTHETIC0001",
              "doc_0000000000000001",
              "0000000000000001",
              "doc",
              "a" * 64,
              "b" * 64,
              normalized,
              {"synthetic": True},
          )
          assert pg_save_document(load_settings("run"), document)
          PY
