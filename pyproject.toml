[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sodnapraksa-ingest"
version = "0.1.6"
description = "Direct source-available ingestion for Slovenian case law."
readme = "README.md"
requires-python = "==3.12.3"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Rajko Majcen" }]
dependencies = ["psycopg[binary]>=3.3,<3.4"]

[project.urls]
Documentation = "https://github.com/OpenLegalCore/slovenia-sodnapraksa-ingest#readme"
Issues = "https://github.com/OpenLegalCore/slovenia-sodnapraksa-ingest/issues"
Repository = "https://github.com/OpenLegalCore/slovenia-sodnapraksa-ingest"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
sodnapraksa-ingest = "sodnapraksa_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sodnapraksa_ingest"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/deploy",
  "/docs",
  "/.env.example",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
